[build-system]
requires = [
    "hatchling",
    "hatch-js",
]
build-backend = "hatchling.build"

[project]
name = "sphinx-pele"
authors = [
    {name = "the sphinx-pele authors", email = "t.paine154@gmail.com"},
]
description = "Pele mermaid diagrams for Sphinx"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = ["sphinx>=9.0.4", "PyYAML>=6.0.3"]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatch-js",
    "hatchling",
    "mdformat",
    "mdformat-frontmatter",
    "myst-parser>=5.1.0",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]

[project.urls]
Repository = "https://github.com/python-project-templates/sphinx-pele"
Homepage = "https://github.com/python-project-templates/sphinx-pele"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"
pre_commit_hooks = [
    "pnpm --dir js install --lockfile-only --no-frozen-lockfile --ignore-scripts",
    "git add js/pnpm-lock.yaml",
]

[[tool.bumpversion.files]]
filename = "sphinx_pele/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "js/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[tool.check-dist]
present = [
    "sphinx_pele/extension/cdn/sphinx-pele.js",
    "sphinx_pele/extension/cdn/sphinx-pele.css",
    "sphinx_pele/extension/cdn/pele-LICENSE",
]
absent = ["node_modules", "docs/_build", ".github"]

[tool.check-dist.sdist]
present = ["js/src", "js/pnpm-lock.yaml", "docs/src"]

[tool.check-dist.wheel]
absent = ["js", "docs"]

[tool.coverage.run]
branch = true
omit = [
    "sphinx_pele/tests/integration/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = [
    "sphinx_pele/extension",
]

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "sphinx_pele",
    "js",
    "docs",
]
exclude = [
    "js/dist",
    "js/node_modules",
    "docs/_build",
    "docs/html",
]

[tool.hatch.build.targets.wheel]
packages = [
    "sphinx_pele",
]
exclude = [
    "js",
]

[tool.hatch.build.hooks.hatch-js]
path = "js"
build_cmd = "build"
tool = "pnpm"
targets = [
    "sphinx_pele/extension/cdn/sphinx-pele.js",
    "sphinx_pele/extension/cdn/sphinx-pele.css",
    "sphinx_pele/extension/cdn/pele-LICENSE",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "sphinx_pele/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "sphinx_pele",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "sphinx-pele"
root = "README.md"
pages = []
use-autoapi = true

